name: Documentation CI

on:
  pull_request:
    branches:
      - main
  workflow_dispatch:

permissions:
  contents: read

jobs:
  docs-validate:
    name: ci/docs-validate
    runs-on: ubuntu-latest
    steps:
      - name: Check out repository
        uses: actions/checkout@11bd71901bbe5b1630ceea73d27597364c9af683 # v4.2.2
      - name: Set up Node.js
        uses: actions/setup-node@49933ea5288caeca8642d1e84afbd3f7d6820020 # v4.4.0
        with:
          node-version: 22.23.2
      - name: Validate Markdown
        run: npx --yes markdownlint-cli2@0.23.2 "**/*.md" "#node_modules" "#dist" "#vendor"
      - name: Validate repository references
        shell: bash
        run: |
          set -euo pipefail
          test -f COMPATIBILITY.md
          test -f engineering/audits/2026-08-engineering-audit.md
          test -f engineering/audits/2026-08-p0-verification.md
          grep -Rqs --exclude-dir=.git 'opsnexus-dashboard' .
          grep -Rqs --exclude-dir=.git 'opsnexus-api' .
          grep -Rqs --exclude-dir=.git 'opsnexus-docs' .
          grep -q 'v0\.5\.0' COMPATIBILITY.md

  link-check:
    name: ci/link-check
    runs-on: ubuntu-latest
    steps:
      - name: Check out repository
        uses: actions/checkout@11bd71901bbe5b1630ceea73d27597364c9af683 # v4.2.2
      - name: Check Markdown links
        uses: lycheeverse/lychee-action@7da8ec1fc4e01b5a12062ac6c589c10a4ce70d67 # v2.0.0
        with:
          lycheeVersion: v0.20.1
          args: --verbose --no-progress --max-retries 2 --retry-wait-time 2 '**/*.md'
